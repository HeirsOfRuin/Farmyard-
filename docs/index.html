<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page paint under the notch and the home
     indicator; the CSS then pads the content back out of them. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Centennial Farm</title>
<meta name="description" content="A Manitoba farm, 1875 to 2000. Five generations, one quarter section to start." />

<!-- Added to the home screen, this opens without browser chrome and looks like
     an app. iOS reads the apple-* tags and ignores the manifest; Android reads
     the manifest and ignores these. Both are needed. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Centennial" />
<meta name="theme-color" content="#f3ead8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="manifest" href="./manifest.webmanifest" />

<style>
/* Centennial Farm — a farm record book you can work in.
   The visual reference is a ledger: ruled paper, ink, a wooden table. */

:root {
  --paper:        #f2ece0;
  --paper-2:      #e8e0d0;
  --paper-3:      #ddd2bd;
  --ink:          #241d16;
  --ink-2:        #4a3f33;
  --ink-3:        #756855;
  --rule:         #c9bda6;
  --rule-strong:  #a99a7e;

  --wheat:        #c8912f;
  --barn:         #8f3c2c;
  --sky:          #4a6d8c;
  --grass:        #5f7a45;
  --alarm:        #a8341f;
  --good:         #4a7040;

  --shadow: 0 1px 2px rgba(36,29,22,.10), 0 4px 14px rgba(36,29,22,.07);
  --radius: 5px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --paper:       #191512;
    --paper-2:     #211c17;
    --paper-3:     #2b241d;
    --ink:         #ece3d4;
    --ink-2:       #c3b7a4;
    --ink-3:       #8e8271;
    --rule:        #3a3128;
    --rule-strong: #4e4336;
    --wheat:       #d9a441;
    --barn:        #b4523d;
    --sky:         #6e97ba;
    --grass:       #7d9455;
    --alarm:       #d4604a;
    --good:        #7ba36a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --paper:       #191512;
  --paper-2:     #211c17;
  --paper-3:     #2b241d;
  --ink:         #ece3d4;
  --ink-2:       #c3b7a4;
  --ink-3:       #8e8271;
  --rule:        #3a3128;
  --rule-strong: #4e4336;
  --wheat:       #d9a441;
  --barn:        #b4523d;
  --sky:         #6e97ba;
  --grass:       #7d9455;
  --alarm:       #d4604a;
  --good:        #7ba36a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: .1px; }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.12rem; }
h3 { font-size: .95rem; }
button { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--paper-2);
  border-bottom: 2px solid var(--rule-strong);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .year { font-family: var(--serif); font-size: 1.55rem; font-weight: 700; color: var(--wheat); line-height: 1; }
.brand .place { font-size: .78rem; color: var(--ink-3); }

.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat .k { font-size: .62rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.stat .v { font-family: var(--mono); font-size: .95rem; font-variant-numeric: tabular-nums; }
.stat .v.neg { color: var(--alarm); }
.stat .v.pos { color: var(--good); }

.main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 0; align-items: start; }

.mapwrap { padding: 16px; min-width: 0; }
.side {
  border-left: 1px solid var(--rule);
  background: var(--paper-2);
  min-height: calc(100vh - 56px);
  display: flex; flex-direction: column;
}
@media (max-width: 1000px) {
  /* One column. The map is not here at all — at this width the render puts it
     behind the Map tab instead, so there is nothing to scroll past. */
  .main { grid-template-columns: 1fr; }
  .side { border-left: none; border-top: 2px solid var(--rule-strong); min-height: 0; }

  /* The tabs stay put while the panel under them scrolls. Without this, every
     tab switch in a 125-turn game costs a scroll back to the top.
     The header gives up its own sticky position to make room: two sticky bars
     at top:0 simply overlap, and on a 664px screen the header was taking a
     third of it. The year and the cash are the first thing in every tab
     anyway, and they come back the moment you scroll up. */
  .topbar { position: static; }
  .main > .tabs { position: sticky; top: 0; z-index: 16; }
}

/* ---------- township map ---------- */
.map-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.map-head .hint { font-size: .78rem; color: var(--ink-3); }
svg.township { width: 100%; height: auto; display: block; background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
.qtr { cursor: pointer; transition: opacity .12s; }
.qtr:hover { opacity: .82; }
.qtr.sel rect.plot { stroke: var(--ink); stroke-width: 3; }
rect.plot { stroke: var(--rule-strong); stroke-width: .8; }
.qtr.mine rect.plot { stroke: var(--ink); stroke-width: 1.8; }
text.qlabel { font-family: var(--mono); font-size: 7.5px; fill: var(--ink); pointer-events: none; }
text.qsub   { font-family: var(--sans); font-size: 6.5px; fill: var(--ink-2); pointer-events: none; }
text.seclabel { font-family: var(--serif); font-size: 9px; fill: var(--ink-3); pointer-events: none; font-style: italic; }
line.secline { stroke: var(--rule-strong); stroke-width: 1.6; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: .72rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px;
  vertical-align: -1px; border: 1px solid rgba(0,0,0,.18); }

/* ---------- the town vignette ---------- */
.town-wrap {
  margin-top: 14px; padding: 8px 10px 4px;
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: var(--radius);
}
svg.town { width: 100%; max-width: 300px; height: auto; display: block; }
text.townlabel { font-family: var(--serif); font-size: 7.5px; font-style: italic; fill: var(--ink-3); }

/* ---------- side panel ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--rule); background: var(--paper-3); }
.tabs button {
  flex: 1; padding: 9px 4px; background: none; border: none; cursor: pointer;
  font-size: .76rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-3); border-bottom: 2px solid transparent;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--wheat); background: var(--paper-2); }
.tabs button:hover { color: var(--ink); }

.panel { padding: 14px 16px; overflow-y: auto; flex: 1; }
.panel h3 { margin: 0 0 6px; color: var(--ink-2); font-size: .74rem;
  text-transform: uppercase; letter-spacing: .07em; }
.panel section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule); }

.row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; font-size: .86rem; }
.row .k { color: var(--ink-2); }
.row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.total { border-top: 1px solid var(--rule); margin-top: 5px; padding-top: 5px; font-weight: 600; }

/* An empty panel must always say WHY it is empty and what would fill it. */
.empty {
  font-size: .82rem; color: var(--ink-3); font-style: italic;
  padding: 10px 12px; border: 1px dashed var(--rule-strong); border-radius: var(--radius);
  background: color-mix(in srgb, var(--paper-3) 55%, transparent);
}

.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: .68rem;
  background: var(--paper-3); color: var(--ink-2); border: 1px solid var(--rule); }
.pill.warn { color: var(--alarm); border-color: color-mix(in srgb, var(--alarm) 45%, transparent); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--rule-strong); background: var(--paper-3); color: var(--ink);
  font-size: .86rem; transition: background .12s, transform .05s;
}
.btn:hover { background: var(--paper); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--wheat); border-color: color-mix(in srgb, var(--wheat) 70%, #000);
  color: #2a1e08; font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--wheat) 88%, #fff); }
.btn.wide { width: 100%; }
.btn.sm { padding: 4px 9px; font-size: .76rem; }

.actionbar { padding: 12px 16px; border-top: 1px solid var(--rule); background: var(--paper-3); }

/* ---------- attention list ---------- */
.attn { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.attn li { display: flex; gap: 8px; align-items: flex-start; font-size: .83rem;
  padding: 7px 10px; border-radius: var(--radius); background: var(--paper-3);
  border-left: 3px solid var(--rule-strong); }
.attn li.urgent { border-left-color: var(--alarm); }
.attn li.opportunity { border-left-color: var(--good); }
.attn li.era { border-left-color: var(--sky); }

/* ---------- field editor ---------- */
.fields { display: flex; flex-direction: column; gap: 5px; }
.field {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 6px 9px; background: var(--paper-3); border-radius: var(--radius);
  border: 1px solid transparent;
}
.field.sel { border-color: var(--wheat); }
.field .nm { font-family: var(--mono); font-size: .78rem; }
.field .meta { font-size: .68rem; color: var(--ink-3); }
select, input[type="number"] {
  font: inherit; font-size: .8rem; padding: 3px 6px; border-radius: 4px;
  border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
}

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20,15,10,.62); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal {
  background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 8px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35); max-width: 700px; width: 100%;
  max-height: 88vh; display: flex; flex-direction: column;
}
.modal header { padding: 16px 20px 10px; border-bottom: 1px solid var(--rule); }
.modal .body { padding: 16px 20px; overflow-y: auto; }
.modal footer { padding: 12px 20px; border-top: 1px solid var(--rule);
  display: flex; gap: 8px; justify-content: flex-end; background: var(--paper-2); }

.histcard { border-left: 3px solid var(--wheat); padding: 2px 0 2px 13px; margin: 0 0 14px; }
.histcard h4 { font-family: var(--serif); font-size: 1.05rem; margin: 0 0 4px; }
.histcard p { margin: 0; font-size: .9rem; color: var(--ink-2); }

.choice { display: block; width: 100%; text-align: left; padding: 11px 13px; margin-bottom: 8px;
  border: 1px solid var(--rule-strong); border-radius: var(--radius); background: var(--paper-2);
  cursor: pointer; }
.choice:hover { background: var(--paper-3); border-color: var(--wheat); }
.choice .lab { font-weight: 600; font-size: .92rem; }
.choice .det { font-size: .82rem; color: var(--ink-3); margin-top: 2px; }

.narr { font-family: var(--serif); font-size: .95rem; color: var(--ink-2);
  border-left: 2px solid var(--rule-strong); padding-left: 12px; margin: 0 0 10px; }

.note { font-size: .85rem; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
.note:last-child { border-bottom: none; }

/* ---------- setup / end screens ---------- */
.center { max-width: 760px; margin: 0 auto; padding: 36px 20px 60px; }
.center h1 { font-size: 2rem; margin-bottom: 4px; }
.lede { font-family: var(--serif); font-size: 1.05rem; color: var(--ink-2); margin: 0 0 26px; }
.optgrid { display: grid; gap: 9px; margin-bottom: 22px; }
.opt { text-align: left; padding: 13px 15px; border: 1px solid var(--rule-strong);
  border-radius: var(--radius); background: var(--paper-2); cursor: pointer; }
.opt:hover { border-color: var(--wheat); }
.opt[aria-pressed="true"] { border-color: var(--wheat); background: var(--paper-3);
  box-shadow: inset 3px 0 0 var(--wheat); }
.opt .lab { font-weight: 600; }
.opt .det { font-size: .84rem; color: var(--ink-3); margin-top: 3px; }

.plaque { text-align: center; padding: 26px; border: 3px double var(--wheat);
  border-radius: 6px; background: var(--paper-2); margin: 20px 0; }
.plaque .big { font-family: var(--serif); font-size: 1.7rem; color: var(--wheat); }

table.ledger { width: 100%; border-collapse: collapse; font-size: .8rem; }
table.ledger th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: .68rem;
  text-transform: uppercase; letter-spacing: .05em; padding: 4px 6px; border-bottom: 1px solid var(--rule-strong); }
table.ledger td { padding: 3px 6px; border-bottom: 1px solid var(--rule); }
table.ledger td.n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------------------
   PHONE
   ---------------------------------------------------------------------------
   This game is a hundred and twenty-five turns long. On a phone that is a
   commute, several commutes, so the things that matter here are the ones that
   make a long session survivable: thumbs that hit what they aim at, nothing
   hidden under the notch or the home indicator, and no gesture that can throw
   away a year's planning.

   Kept in a separate block rather than woven through, so the desktop layout
   above stays exactly as it was and this can be read as one piece.
   --------------------------------------------------------------------------- */

html {
  /* iOS inflates text in landscape unless told not to. */
  -webkit-text-size-adjust: 100%;
  /* Pull-to-refresh reloads the page. Mid-year, that is a spring's planning
     gone — the save is written at the END of a year, not during one. */
  overscroll-behavior-y: contain;
}

#app {
  /* 100vh on mobile Safari counts the URL bar that is about to slide away, so
     the page is always slightly too tall and jumps as you scroll. dvh is the
     height actually available. The vh line stays as the fallback. */
  min-height: 100vh;
  min-height: 100dvh;
}

/* Out from under the notch, the status bar and the home indicator. With
   viewport-fit=cover the page paints edge to edge, which is what makes an
   installed web app look like an app; these put the CONTENT back inside. */
/* Through tokens, not env() directly, because a host that has ALREADY padded
   the root by the insets needs them back at zero or the notch is paid for
   twice. The standalone file keeps the real values. */
:root {
  --sa-top:    env(safe-area-inset-top, 0px);
  --sa-bottom: env(safe-area-inset-bottom, 0px);
  --sa-left:   env(safe-area-inset-left, 0px);
  --sa-right:  env(safe-area-inset-right, 0px);
}
.topbar { padding-top: calc(10px + var(--sa-top)); }
.topbar, .actionbar, .panel, .center {
  padding-left: calc(16px + var(--sa-left));
  padding-right: calc(16px + var(--sa-right));
}
.actionbar { padding-bottom: calc(12px + var(--sa-bottom)); }

@media (pointer: coarse) {
  /* 44px is the smallest thing a thumb hits reliably. The desktop build is
     denser on purpose and is left alone — this only fires on a touch screen. */
  .btn { min-height: 44px; padding: 10px 16px; }
  .btn.sm { min-height: 40px; min-width: 40px; padding: 8px 12px; font-size: .8rem; }
  .tabs button { min-height: 46px; }
  /* No 300ms wait for a double-tap that is not coming. */
  .btn, .tabs button, button { touch-action: manipulation; }
  /* A long press on a control should not select its label or pop the callout
     menu. The ledger and the year's notes are left selectable — those are
     there to be read, and sometimes copied out. */
  .topbar, .tabs, .actionbar, .btn { -webkit-user-select: none; user-select: none; }
  .topbar, .tabs, .actionbar { -webkit-touch-callout: none; }
}

@media (max-width: 560px) {
  body { font-size: 16px; }             /* 16px stops iOS zooming on focus */
  .topbar { gap: 10px; padding-left: 12px; padding-right: 12px; }
  .brand .year { font-size: 1.35rem; }
  /* Four or five stat blocks will not fit across a phone. They wrap and scroll
     sideways instead of squeezing to nothing. */
  .topbar .stat { min-width: 0; }
  .panel, .center { padding-left: 14px; padding-right: 14px; }
  .center { padding-top: 24px; }

  /* The one button that ends the year stays where the thumb is, whatever the
     panel above it is doing. Without this it sits at the bottom of a long
     scroll and every turn costs a hunt for it. */
  .actionbar {
    position: sticky; bottom: 0; z-index: 15;
    box-shadow: 0 -8px 20px rgba(0, 0, 0, .13);
  }
}

/* ---------- the walkthrough ---------- */
.coach {
  border: 1px solid var(--wheat);
  /* A wash of the accent rather than another card: this is the one thing on
     the page that is not part of the farm, and it should read that way without
     shouting over the year's actual decisions. */
  background: color-mix(in srgb, var(--wheat) 11%, var(--paper));
  border-radius: var(--radius);
  padding: 12px 14px 13px;
  margin-bottom: 18px;
}
.coach-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.coach-tag {
  font-size: .64rem; text-transform: uppercase; letter-spacing: .09em;
  font-weight: 600; color: color-mix(in srgb, var(--wheat) 65%, var(--ink));
}
.coach h3 { margin-bottom: 6px; }
.coach-body { margin: 0; font-size: .88rem; color: var(--ink-2); }
.coach-body strong { color: var(--ink); }
.coach-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.coach-wait { font-size: .76rem; color: var(--ink-3); font-style: italic; }
.coach.collapsed { padding-bottom: 10px; }
.coach.collapsed .coach-head { margin-bottom: 0; }

.walkthrough-opt {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 22px 0 18px; font-size: .84rem; color: var(--ink-2);
  cursor: pointer;
}
.walkthrough-opt input { margin-top: 3px; width: 17px; height: 17px; flex: none; accent-color: var(--wheat); }
@media (pointer: coarse) { .walkthrough-opt input { width: 22px; height: 22px; } }

</style>
